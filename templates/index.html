    const taskThree = L.layerGroup();

    // Skapa supermarket markers utan bilder (circleMarker istället för marker)
    const superMarkers = L.geoJSON(supermarket, {
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: "blue",
          color: "#000",
          weight: 1,
          opacity: 1,
          fillOpacity: 0.7
        });
      },
      onEachFeature: function (feature, layer) {
        const name = feature.properties.name || "Okänd butik";
        layer.bindPopup(`<b>${name}</b>`);
      }
    });
    taskThree.addLayer(superMarkers);

    // Buffra varje supermarketpunkt med Turf.js
    const bufferedFeatures = supermarket.features.map(feature => {
      return turf.buffer(feature, 1, { units: 'kilometers' });
    });

    const bufferGeoJSON = {
      type: "FeatureCollection",
      features: bufferedFeatures
    };

    const bufferLayer = L.geoJSON(bufferGeoJSON, {
      style: {
        color: "green",
        fillColor: "lightgreen",
        fillOpacity: 0.4
      }
    });
    taskThree.addLayer(bufferLayer);

    // Identifiera icke-överlappande butiker
    const nonOverlapping = [];

    for (let i = 0; i < bufferedFeatures.length; i++) {
      const thisFeature = bufferedFeatures[i];
      let overlaps = false;

      for (let j = 0; j < bufferedFeatures.length; j++) {
        if (i !== j) {
          const otherFeature = bufferedFeatures[j];
          if (turf.booleanOverlap(thisFeature, otherFeature)) {
            overlaps = true;
            break;
          }
        }
      }

      if (!overlaps) {
        nonOverlapping.push(supermarket.features[i]);
      }
    }

    // Visa icke-överlappande som röda cirklar
    const nonOverlapLayer = L.geoJSON(nonOverlapping, {
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 8,
          fillColor: "red",

        layer.bindPopup(" Ej överlappande:<br><b>" + name + "</b>");

    taskThree.addLayer(nonOverlapLayer);

    // --------------- Task 6 --------------- //
    const taskSix = L.layerGroup();

      { name: "Borlänge", coords: [60.4840, 15.4371] }
    ];
    
    // Funktion som hämtar väder för en stad
    function getWeatherInfo(cityObj) {
      console.log("Hämtar väder för:", cityObj.name); // Debug
    
      fetch(`/weather?city=${cityObj.name}`)
        .then(res => {
          if (!res.ok) {
            throw new Error(`❌ API-anrop misslyckades för ${cityObj.name}`);
          }
          return res.json();
        })
        .then(data => {
          console.log("Mottagen data:", data); // Debug
    
          const current = data.current;
          const forecastList = data.forecast?.list?.slice(0, 3) || [];
    
          // Skapa popup-innehåll
          const popupContent = `
            <b>${cityObj.name}</b><br>
            Temp: ${current.main.temp} °C<br>
            Väder: ${current.weather[0].description}<br>
            <small><i>Prognos:</i><br>
            ${forecastList.map(f => `${f.dt_txt.split(" ")[1]}: ${f.main.temp}°C, ${f.weather[0].main}`).join("<br>")}
            </small>
          `;
    
          // Skapa markör med popup
          const defaultIcon = L.icon({
            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
          });
          
          const marker = L.marker(cityObj.coords, { icon: defaultIcon }).bindPopup(popupContent);
          
    
          // Klick öppnar väder i sidopanel
          marker.on("click", () => {
            document.getElementById("sidebar-content").innerHTML = `
              <h2>${cityObj.name}</h2>
              <p><b>Nuvarande väder:</b><br>
              Temperatur: ${current.main.temp} °C<br>
              Vind: ${current.wind.speed} m/s<br>
              Luftfuktighet: ${current.main.humidity}%<br>
              Väder: ${current.weather[0].description}</p>
    
              ${forecastList.length > 0 ? `
                <h4>Prognos</h4>
                ${forecastList.map(f => `
                  <p>${f.dt_txt}<br>
                  Temp: ${f.main.temp}°C – ${f.weather[0].main}</p>
                `).join("")}
              ` : "<p><i>Ingen prognos tillgänglig</i></p>"}
            `;
            sidebar.open('home');
          });
    
          taskSix.addLayer(marker);
        })
        .catch(error => {
          console.error("❗ Fel vid väderhämtning:", error);
          alert("Kunde inte hämta väderdata för " + cityObj.name);
        });
    }
    
    // Toggle-knapp Task 6
    document.getElementById("t6").addEventListener("click", () => {

        cities.forEach(city => getWeatherInfo(city));
